<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASTRO CC — Command &amp; Control</title>
  <meta name="theme-color" content="#07090c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cockpit">

    <!-- ============ OBERTES PANEL: STATUS & COMMS ============ -->
    <header id="topbar">
      <div id="title" class="tp-brand">ASTRO&nbsp;CC<span class="tp-sub">COMMAND&nbsp;&amp;&nbsp;CONTROL</span></div>
      <div class="tp-block mono" id="tp-status"><span class="led"></span><span id="tp-status-text">SYSTEM&nbsp;SECURE</span></div>
      <!-- Glareshield: quadratische Warnlampen wie im Jet-Cockpit -->
      <div class="led-strip" id="status-leds">
        <span class="sq-led" id="led-vrn" title="VRN Transit Sync"></span>
        <span class="sq-led" id="led-bias" title="Bias-Korrektur aktiv"></span>
        <span class="sq-led" id="led-obs" title="Observation Mode"></span>
        <span class="sq-led" id="led-uap" title="UAP DB Link (Vorbereitung)"></span>
      </div>
      <div id="freshness" class="freshness mono">lade…</div>
      <!-- Primaer-Fluginstrumente: die vier Rundinstrumente direkt am
           Glareshield, streng horizontal -->
      <div class="glareshield-gauges" id="astro-instruments">
        <div class="gauge-row">
          <div class="gauge-wrap">
            <svg viewBox="0 0 100 90" class="gauge" id="gauge-seeing">
              <circle cx="50" cy="45" r="35" class="gauge-body"/>
              <circle cx="50" cy="45" r="35" class="gauge-ring"/>
              <circle cx="50" cy="45" r="30" class="gauge-ticks"/>
              <line x1="50" y1="45" x2="50" y2="15" class="gauge-needle needle-amber" id="seeing-needle" transform="rotate(-90 50 45)"/>
              <circle cx="50" cy="45" r="4" class="gauge-hub"/>
              <text x="50" y="65" text-anchor="middle" class="gauge-label">SEEING</text>
              <text x="50" y="83" text-anchor="middle" class="gauge-val" id="seeing-val">--</text>
            </svg>
          </div>
          <div class="gauge-wrap">
            <svg viewBox="0 0 100 90" class="gauge" id="gauge-tau">
              <circle cx="50" cy="45" r="35" class="gauge-body"/>
              <circle cx="50" cy="45" r="35" class="gauge-ring"/>
              <circle cx="50" cy="45" r="30" class="gauge-ticks"/>
              <line x1="50" y1="45" x2="50" y2="15" class="gauge-needle needle-cyan" id="tau-needle" transform="rotate(90 50 45)"/>
              <circle cx="50" cy="45" r="4" class="gauge-hub"/>
              <text x="50" y="65" text-anchor="middle" class="gauge-label">TAU&nbsp;DP</text>
              <text x="50" y="83" text-anchor="middle" class="gauge-val" id="tau-val">--</text>
            </svg>
          </div>
          <div class="gauge-wrap">
            <svg viewBox="0 0 100 90" class="gauge" id="gauge-wind">
              <circle cx="50" cy="45" r="35" class="gauge-body"/>
              <circle cx="50" cy="45" r="35" class="gauge-ring"/>
              <circle cx="50" cy="45" r="30" class="gauge-ticks"/>
              <line x1="50" y1="45" x2="50" y2="15" class="gauge-needle needle-cyan" id="wind-needle" transform="rotate(-90 50 45)"/>
              <circle cx="50" cy="45" r="4" class="gauge-hub"/>
              <text x="50" y="65" text-anchor="middle" class="gauge-label">WIND</text>
              <text x="50" y="83" text-anchor="middle" class="gauge-val" id="wind-val">--</text>
            </svg>
          </div>
          <div class="gauge-wrap">
            <!-- inverse Skala: 10K (sicher) rechts, 0K (Beschlag) links -->
            <svg viewBox="0 0 100 90" class="gauge" id="gauge-dew">
              <circle cx="50" cy="45" r="35" class="gauge-body"/>
              <circle cx="50" cy="45" r="35" class="gauge-ring"/>
              <circle cx="50" cy="45" r="30" class="gauge-ticks"/>
              <line x1="50" y1="45" x2="50" y2="15" class="gauge-needle needle-cyan" id="dew-needle" transform="rotate(90 50 45)"/>
              <circle cx="50" cy="45" r="4" class="gauge-hub"/>
              <text x="50" y="65" text-anchor="middle" class="gauge-label">DEW</text>
              <text x="50" y="83" text-anchor="middle" class="gauge-val" id="dew-val">--</text>
            </svg>
          </div>
        </div>
      </div>
      <div class="tp-actions">
        <button id="btn-mode" class="hbtn mode" title="Profil: DSO / Planetarisch">DSO</button>
        <button id="btn-refresh" class="hbtn" title="Jetzt aktualisieren">&#8635;</button>
        <button id="btn-gps" class="hbtn" title="Live-Standort setzen (GPS)">&#9678;</button>
        <button id="btn-night" class="hbtn" title="Rotlicht-Modus umschalten">&#9789;</button>
        <button id="btn-config" class="hbtn" title="Server-Adresse konfigurieren">&#9881;</button>
      </div>
    </header>

    <!-- ============ LINKES PANEL: SENSOREN-KONTROLLE ============ -->
    <aside id="left-panel">
      <div class="panel-hdr">SENSOREN</div>
      <div class="hw-stack" id="layer-hw-stack">
        <button class="hw-btn" data-layer="regen"><i class="hw-led"></i>REGEN<i class="hw-sub">ICONS&nbsp;OM</i></button>
        <button class="hw-btn" data-layer="radar"><i class="hw-led"></i>RADAR<i class="hw-sub">RAW&nbsp;TILES</i></button>
        <button class="hw-btn" data-layer="satellite"><i class="hw-led"></i>SAT<i class="hw-sub">CLOUD&nbsp;IR</i></button>
        <button class="hw-btn" data-layer="warn"><i class="hw-led"></i>WARN<i class="hw-sub">DWD</i></button>
        <button class="hw-btn" data-layer="lp"><i class="hw-led"></i>LP<i class="hw-sub">ATLAS</i></button>
      </div>
      <div class="panel-hdr" style="margin-top:12px">VIEW</div>
      <div class="hw-stack hw-stack-row">
        <button class="hw-btn hw-mini" id="zoom-in" title="Vergrößern">＋</button>
        <button class="hw-btn hw-mini" id="zoom-out" title="Verkleinern">－</button>
        <button class="hw-btn hw-mini" id="left-panel-pin" title="Panel ein-/ausklappen">◄</button>
      </div>
      <div class="panel-hdr" style="margin-top:12px">LUNAR&nbsp;HORIZON</div>
      <div id="lunar-horizon">
        <div id="lh-best-label">BEST&nbsp;SITE&nbsp;<b id="lh-best">--</b></div>
        <div id="lh-box">
          <div id="lh-sky"></div>
          <div id="lh-hline"></div>
          <div id="lh-moon">&#127765;</div>
          <div id="lh-ground"></div>
        </div>
        <div id="lh-data"><span id="lh-alt">--</span> <span id="lh-illum">--</span></div>
      </div>
      <div class="panel-hdr" style="margin-top:12px">TARGET&nbsp;LOCK</div>
      <div id="target-lock" class="mono">
        <div id="tl-moon" class="tl-line tl-pending">[STANDBY] MOON | ALT: --</div>
        <div id="tl-secondary" class="tl-secondary mono"></div>
      </div>
    </aside>

    <!-- ============ ZENTRUM: WINDSCHUTZSCHEIBE ============ -->
    <main id="map-wrap"><div id="map"></div></main>

    <!-- Detail-Panel (Tap auf Marker) — als HUD-Overlay über der Karte -->
    <section id="panel" class="hidden">
      <button id="panel-close" class="hbtn">&#10005;</button>
      <div class="tabs">
        <button id="tab-now" class="tab active">Jetzt</button>
        <button id="tab-fc" class="tab">Vorausschau</button>
      </div>
      <div id="panel-content"></div>
    </section>

    <!-- ============ RECHTES PANEL: INTELLIGENCE & EXECUTION ============ -->
    <aside id="right-panel">
      <div class="panel-hdr">INTEL&nbsp;//&nbsp;ZUVERLÄSSIGKEIT</div>
      <div id="bias-slot" class="right-scroll">
        <div id="iw-tabs" class="iw-tabs">
          <button class="iw-tab active" data-tab="bias">BIAS</button>
          <button class="iw-tab" data-tab="bot">BOT&nbsp;CMDS</button>
        </div>
        <div id="iw-body"></div>
      </div>
      <div class="panel-hdr" style="margin-top:6px">COMMS&nbsp;FEED</div>
      <div id="comms-terminal" class="mono" aria-live="polite"></div>
      <div id="master-switch-dock">
        <label class="guard-switch guard-master" title="Astro-Observation: schaltet proaktive Wetter-Alarme">
          <input type="checkbox" id="obs-mode-sw">
          <span class="guard-frame">
            <span class="guard-on">ARMED</span><span class="guard-off">SAFE</span>
            <span class="guard-cover"></span>
          </span>
        </label>
        <div class="guard-caption mono">ASTRO&nbsp;OBSERVATION<br>
          <small>Wetter-Alarme nur wenn gelegt</small></div>
      </div>
    </aside>

    <!-- ============ UNTERTES PANEL: TIMELINE ============ -->
    <footer id="bottom-panel">
      <span class="tl-label mono">T-TRACK&nbsp;<b id="tl-value">NOW</b></span>
      <div class="tl-track" id="tl-track"><div class="tl-slot" id="tl-slot"
        ><input type="range" min="0" max="6" step="1" value="0" id="rg-slider" aria-label="Regen-Prognose Stunden"
        ></div><button id="rg-play" class="hw-btn hw-mini" title="Zeitverlauf abspielen">&#9654;</button></div>
      <span class="tl-label mono" id="rg-label">Jetzt</span>
      <button class="hw-btn hw-mini" id="right-panel-pin" title="Intel-Panel ein-/ausklappen">INTEL►</button>
    </footer>
  </div>

  <!-- Zahnrad-Menü (Popup) -->
  <div id="cfg-menu" class="hidden">
    <button id="menu-config" class="menu-item">&#9881; Server konfigurieren…</button>
    <button id="menu-changelog" class="menu-item">&#128220; Änderungen</button>
  </div>

  <!-- Änderungsprotokoll (Overlay) -->
  <section id="changelog" class="overlay hidden">
    <button id="changelog-close" class="hbtn">&#10005;</button>
    <h2>Änderungen</h2>
    <div id="changelog-list"></div>
  </section>

  <script src="vendor/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
